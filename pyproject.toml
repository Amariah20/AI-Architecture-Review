[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "architecture-review"
version = "0.1.0"
description = "AI Architecture Review & Optimisation Assistant"
dependencies = [
    "mcp==2.3.0",
    "streamlit==1.67.0",
    "pypdf==7.0.0",
    "python-docx==1.2.0",
    "pypdfium2==5.15.1",
]

[tool.setuptools.packages.find]
where = ["src"]
